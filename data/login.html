<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>MotionOS — Login</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0e1a;--s1:#111827;--s2:#1e2a3d;--border:#1f3454;
    --txt:#e2e8f0;--mut:#64748b;--a1:#3b82f6;--a1h:#2563eb;--err:#ef4444;
  }
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
  .card{background:var(--s1);border:1px solid var(--border);border-radius:16px;
    padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .logo{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;justify-content:center}
  .logo-icon{width:48px;height:48px}
  .logo-text{font-size:1.5rem;font-weight:700;letter-spacing:.02em}
  .logo-sub{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-top:1px}
  .field{margin-bottom:1.2rem}
  label{display:block;font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
  input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;
    color:var(--txt);font-size:1rem;padding:.75rem 1rem;outline:none;transition:border .15s}
  input:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .btn{width:100%;background:var(--a1);border:none;border-radius:8px;color:#fff;
    cursor:pointer;font-size:1rem;font-weight:600;padding:.85rem;margin-top:.5rem;
    transition:background .15s;-webkit-appearance:none;appearance:none}
  .btn:active{background:var(--a1h)}
  .err{color:var(--err);font-size:.85rem;margin-top:.75rem;min-height:1.2em;text-align:center}
  .footer{color:var(--mut);font-size:.7rem;text-align:center;margin-top:1.5rem}
  .spinner{display:none;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;width:18px;height:18px;animation:spin .7s linear infinite;
    margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="10" fill="#111827"/>
      <circle cx="24" cy="24" r="14" stroke="#1f3454" stroke-width="2"/>
      <!-- rotation arc -->
      <path d="M24 10 A14 14 0 0 1 38 24" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M24 10 A14 14 0 1 0 10 24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- arrow tip -->
      <polyline points="9,20 10,24 14,22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- center hub -->
      <circle cx="24" cy="24" r="4" fill="#3b82f6"/>
    </svg>
    <div>
      <div class="logo-text">MotionOS</div>
      <div class="logo-sub">Motor Controller</div>
    </div>
  </div>

  <div class="field">
    <label for="usr">Username</label>
    <input id="usr" type="text" autocomplete="username" autocapitalize="none"
           spellcheck="false" placeholder="admin" value="admin">
  </div>
  <div class="field">
    <label for="pwd">Password</label>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Sign in</button>
  <div class="spinner" id="spin"></div>
  <div class="err" id="err"></div>
  <div class="footer">MotionOS v1.0.0</div>
</div>

<script>
  document.getElementById('pwd').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  document.getElementById('usr').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('pwd').focus(); });

  async function doLogin() {
    const btn  = document.getElementById('loginBtn');
    const spin = document.getElementById('spin');
    const err  = document.getElementById('err');
    const u    = document.getElementById('usr').value.trim();
    const p    = document.getElementById('pwd').value;
    if (!u || !p) { err.textContent = 'Enter credentials'; return; }

    btn.style.display  = 'none';
    spin.style.display = 'block';
    err.textContent    = '';

    try {
      const r = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({u, p})
      });
      if (r.ok) {
        // Sync browser time to firmware
        await fetch('/api/time', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ epoch: Date.now(), tzOffset: -(new Date().getTimezoneOffset()) })
        }).catch(()=>{});
        window.location.href = '/';
      } else {
        err.textContent = 'Invalid credentials';
        btn.style.display  = 'block';
        spin.style.display = 'none';
        document.getElementById('pwd').value = '';
        document.getElementById('pwd').focus();
      }
    } catch {
      err.textContent    = 'Connection failed — retry';
      btn.style.display  = 'block';
      spin.style.display = 'none';
    }
  }
</script>
</body>
</html>
